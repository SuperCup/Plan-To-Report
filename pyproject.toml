[project]
name = "plan-to-report"
version = "0.1.0"
description = "Windows desktop tool for configurable Excel-to-Excel conversion."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
plan-to-report = "plan_to_report.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
